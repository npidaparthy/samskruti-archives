# Reusable "daily verse card" workflow (lives ONLY in samskruti-archives).
#
# A site's caller workflow (daily/… README §6) invokes this with `uses:` and
# passes the path to its config.json. This checks out the site + the central
# generator, renders every feed's card, commits the refreshed daily/<feed>/today.*
# back to the site, and pushes dated archive copies (+ updated rotation order)
# to samskruti-archives.
#
# The generator code is checked out fresh from central each run, so sites get
# tool updates automatically (README §7).
name: daily-reusable

on:
  workflow_call:
    inputs:
      config:
        description: "Path to the site's config.json (relative to the site repo root)."
        required: true
        type: string
      force:
        description: "Skip the timezone hour gate (manual/testing)."
        required: false
        type: boolean
        default: false
      feeds:
        description: "Comma-separated feed ids to run (blank = all feeds in config)."
        required: false
        type: string
        default: ""
      script:
        description: "Verse script override: te | sa | iast (blank = each feed's default)."
        required: false
        type: string
        default: ""
      deploy_workflow:
        description: "Optional site workflow file (e.g. deploy.yml) to dispatch after committing, so Pages rebuilds. Needed because a GITHUB_TOKEN push does not itself trigger the site's deploy. Empty = skip."
        required: false
        type: string
        default: ""
      tool_repo:
        description: "Central repo holding daily-tool/ + order/ + archive dirs."
        required: false
        type: string
        default: "npidaparthy/samskruti-archives"
      tool_ref:
        description: "Ref of the central repo to check out (should match the @ref this workflow is called with)."
        required: false
        type: string
        default: "main"
      telegram_mode:
        description: "live | test | none  (live = normal, test = testChatIds, none = skip)"
        required: false
        type: string
        default: "live"
    secrets:
      ARCHIVE_TOKEN:
        description: "Fine-grained PAT with contents:write on samskruti-archives."
        required: true
      TELEGRAM_TOKEN:
        description: "Telegram bot token (optional; used by a later iteration)."
        required: false

concurrency:
  group: daily-${{ github.repository }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push refreshed daily/* back to the calling site repo
      actions: write  # dispatch the site's deploy workflow (Pages rebuild)
    steps:
      # 1. The calling site repo (github.repository is the caller for reusable
      #    workflows), so a default checkout gives us the site.
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0   # full history so rebase-on-push works

      # 2. Central repo: holds daily-tool/ (generator) + order/ + archive dirs.
      #    Checked out with ARCHIVE_TOKEN so we can push archive + order updates.
      #    (github.workflow_ref points at the CALLER, not this reusable workflow,
      #    so the central repo/ref are explicit inputs — README §7.)
      - name: Checkout central (samskruti-archives)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          token: ${{ secrets.ARCHIVE_TOKEN }}
          path: central
          fetch-depth: 0   # full history so archive rebase-on-push works

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable   # stable Google Chrome honours --screenshot (Chromium snapshots don't)

      # 4. Indic fonts — without these headless Chrome renders Telugu/Devanagari
      #    as boxes (README §13).
      - name: Install Indic fonts + image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core fonts-noto-ui-core \
            fonts-lohit-telu fonts-lohit-deva fonts-gargi \
            imagemagick webp
          sudo fc-cache -f

      # 5. Generate every feed's card. Scheduled runs honour the Sydney hour gate
      #    (§8); manual dispatch (or inputs.force) bypasses it.
      - name: Generate daily cards
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FEEDS: ${{ inputs.feeds }}
          SCRIPT: ${{ inputs.script }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="$ARGS --force"
          fi
          [ -n "$FEEDS" ]  && ARGS="$ARGS --feed $FEEDS"
          [ -n "$SCRIPT" ] && ARGS="$ARGS --script $SCRIPT"
          [ "${{ inputs.telegram_mode }}" = "none" ] && ARGS="$ARGS --no-telegram"
          [ "${{ inputs.telegram_mode }}" = "test" ] && ARGS="$ARGS --test-telegram"
          node central/daily-tool/src/gen.js \
            --config "site/${{ inputs.config }}" \
            --data-root site \
            --out-root site \
            --order-dir central/daily-tool/order \
            --archive-root central \
            --chrome "${{ steps.chrome.outputs.chrome-path }}" \
            $ARGS

      # 6. Commit the refreshed today.* back to the SITE repo (overwrite).
      - name: Commit to site
        id: commit
        working-directory: site
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -A daily/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "daily: refresh verse cards"
          # main may have moved since checkout (PR merges, a prior/concurrent daily
          # run). Replay our commit onto the latest main; since today.* are
          # generated, our freshly-rendered version wins any conflict (-X theirs =
          # the commit being rebased), while unrelated changes on main are kept.
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              echo "committed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "push rejected; rebasing onto origin/$BRANCH (ours win) — attempt $i"
            git fetch origin "$BRANCH" || exit 1
            git rebase -X theirs "origin/$BRANCH" || { git rebase --abort; exit 1; }
          done
          echo "failed to push to site after retries"; exit 1

      # 6b. Rebuild the site. A push made with GITHUB_TOKEN does not trigger the
      #     site's own workflows, so dispatch its deploy explicitly (if configured).
      - name: Trigger site deploy
        if: steps.commit.outputs.committed == 'true' && inputs.deploy_workflow != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ inputs.deploy_workflow }}" --repo "${{ github.repository }}"

      # 7. Push dated archive copies + any rotation-order updates to central.
      - name: Commit to central archive
        working-directory: central
        env:
          CENTRAL_BRANCH: ${{ inputs.tool_ref }}
        run: |
          git config user.name  "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No archive changes to commit."; exit 0
          fi
          git commit -m "daily: archive ${{ github.repository }} verse cards [skip ci]"
          # Other sites may push archives concurrently. Replay onto the latest
          # branch; our generated files (dated archives + rotation orders) win.
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$CENTRAL_BRANCH"; then exit 0; fi
            echo "archive push rejected; rebasing onto origin/$CENTRAL_BRANCH (ours win) — attempt $i"
            git fetch origin "$CENTRAL_BRANCH" || exit 1
            git rebase -X theirs "origin/$CENTRAL_BRANCH" || { git rebase --abort; exit 1; }
          done
          echo "failed to push archive after retries"; exit 1

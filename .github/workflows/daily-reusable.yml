# Reusable "daily verse card" workflow (lives ONLY in samskruti-archives).
#
# A site's caller workflow (daily/… README §6) invokes this with `uses:` and
# passes the path to its config.json. This checks out the site + the central
# generator, renders every feed's card, commits the refreshed daily/<feed>/today.*
# back to the site, and pushes dated archive copies (+ updated rotation order)
# to samskruti-archives.
#
# The generator code is checked out fresh from central each run, so sites get
# tool updates automatically (README §7).
name: daily-reusable

on:
  workflow_call:
    inputs:
      config:
        description: "Path to the site's config.json (relative to the site repo root)."
        required: true
        type: string
      force:
        description: "Skip the timezone hour gate (manual/testing)."
        required: false
        type: boolean
        default: false
    secrets:
      ARCHIVE_TOKEN:
        description: "Fine-grained PAT with contents:write on samskruti-archives."
        required: true
      TELEGRAM_TOKEN:
        description: "Telegram bot token (optional; used by a later iteration)."
        required: false

concurrency:
  group: daily-${{ github.repository }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push refreshed daily/* back to the calling site repo
    steps:
      # 1. The calling site repo (github.repository is the caller for reusable
      #    workflows), so a default checkout gives us the site.
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: site

      # 2. Work out which repo/ref THIS reusable workflow came from, so we check
      #    out the matching generator + order files (README §7 propagation).
      - name: Resolve central tool repo
        id: tool
        run: |
          ref="${{ github.workflow_ref }}"          # owner/repo/.github/workflows/x.yml@refs/heads/main
          repo="${ref%%/.github/*}"
          sha="${ref##*@}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$sha"  >> "$GITHUB_OUTPUT"

      # 3. Central repo: holds daily-tool/ (generator) + order/ + archive dirs.
      #    Checked out with ARCHIVE_TOKEN so we can push archive + order updates.
      - name: Checkout central (samskruti-archives)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.tool.outputs.repo }}
          ref: ${{ steps.tool.outputs.ref }}
          token: ${{ secrets.ARCHIVE_TOKEN }}
          path: central

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      # 4. Indic fonts — without these headless Chrome renders Telugu/Devanagari
      #    as boxes (README §13).
      - name: Install Indic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core fonts-noto-ui-core \
            fonts-lohit-telu fonts-lohit-deva fonts-gargi
          sudo fc-cache -f

      # 5. Generate every feed's card. Scheduled runs honour the Sydney hour gate
      #    (§8); manual dispatch (or inputs.force) bypasses it.
      - name: Generate daily cards
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE="--force"
          fi
          node central/daily-tool/src/gen.js \
            --config "site/${{ inputs.config }}" \
            --data-root site \
            --out-root site \
            --order-dir central/daily-tool/order \
            --archive-root central \
            --chrome "${{ steps.chrome.outputs.chrome-path }}" \
            $FORCE

      # 6. Commit the refreshed today.* back to the SITE repo (overwrite).
      - name: Commit to site
        working-directory: site
        run: |
          git config user.name  "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -A daily/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "daily: refresh verse cards [skip ci]"
            git push
          fi

      # 7. Push dated archive copies + any rotation-order updates to central.
      - name: Commit to central archive
        working-directory: central
        run: |
          git config user.name  "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "daily: archive ${{ github.repository }} verse cards [skip ci]"
            git push
          fi

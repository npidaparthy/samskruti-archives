<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>రోజువారీ శ్లోకం · Daily Verse</title>
<meta name="description" content="Verse of the day — a śloka, its meaning, and commentary. Browse past days.">
<link rel="stylesheet" href="daily.css">
</head>
<body>
  <header class="top">
    <div class="top-left">
      <a class="back" href="/" aria-label="Back to site">←</a>
      <a class="brand" href="/">సంస్కృతిః</a>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Feeds"></nav>

  <div class="controls">
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
    <div class="datebar">
      <button class="nav-arrow" id="prev" type="button" aria-label="Previous day">‹</button>
      <button class="date-pill" id="datePill" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="date"></span><span class="caret">▾</span>
      </button>
      <button class="nav-arrow" id="next" type="button" aria-label="Next day">›</button>
    </div>
  </div>
  <div class="cal-popover" id="calPopover" hidden></div>

  <main class="stage">
    <figure class="card">
      <img id="card-img" alt="Verse card" />
      <figcaption class="empty" id="empty" hidden>Card not available for this date.</figcaption>
    </figure>

    <div class="actions">
      <button id="share" class="btn" type="button">Share</button>
      <a id="download" class="btn ghost" download>Download</a>
    </div>

    <section class="caption" id="caption" aria-live="polite"></section>
  </main>

  <footer class="foot">
    <a id="site-link" href="/">samskruti.info</a>
  </footer>

  <script src="daily.js"></script>
</body>
</html>
